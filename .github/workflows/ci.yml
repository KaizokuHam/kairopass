name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Cache disposable MongoDB test binary
        uses: actions/cache@v5
        with:
          path: .mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ runner.arch }}-8.2.6
      - name: Lint
        run: npm run lint
      - name: Type-check both workspaces
        run: npm run typecheck
      - name: Run frontend, HTTP, and disposable replica-set database tests
        run: npm test
      - name: Build client and server
        run: npm run build
